# ============================================================================
# tmux Configuration (Linux / Vim-Centric)
# ============================================================================
# Target path via chezmoi: ~/.config/tmux/tmux.conf
# Pure built-in tmux configuration (no external plugin manager required).
# ============================================================================

# ============================================================================
# 1. Prefix Key
# ============================================================================
# Replace default Ctrl-b (conflicts with Vim page-up) with Ctrl-g.
unbind C-b
set -g prefix C-g
bind C-g send-prefix

# ============================================================================
# 2. Terminal, TrueColor & Neovim Integration
# ============================================================================
set -g default-terminal "tmux-256color"

# Enable 24-bit TrueColor, styled undercurls, and extended keys for modern terminals
# Guarded so reloading this config (Prefix + r) does not duplicate array entries.
if-shell -F "#{!=:#{@_tmux_env_initialized},1}" {
    set -as terminal-features "xterm-256color:RGB:usstyle:extkeys"
    set -as terminal-features "alacritty:RGB:usstyle:extkeys"
    set -as terminal-features "wezterm:RGB:usstyle:extkeys"
    set -as terminal-features "xterm-kitty:RGB:usstyle:extkeys"
    set -as terminal-features "xterm-ghostty:RGB:usstyle:extkeys"
    set -as terminal-features "foot*:RGB:usstyle:extkeys"
    set -as terminal-features "tmux-256color:RGB:usstyle"
    set -ga update-environment "WAYLAND_DISPLAY"
    set -g @_tmux_env_initialized 1
}

# Eliminate Escape delay for Vim/Neovim mode switching
set -sg escape-time 10

# Pass focus events and extended keys (e.g., Ctrl-Enter, Shift-Tab) to Neovim
set -s focus-events on
set -s extended-keys on

# Allow inner applications (e.g., Neovim) to pass terminal escape sequences through
set -gw allow-passthrough on

# ============================================================================
# 3. General Behavior
# ============================================================================
set -g history-limit 50000
set -g mouse on
set -g repeat-time 500
set -g display-time 2000
set -g display-panes-time 2000

# 1-based indexing for windows and panes (matches keyboard number row)
set -g base-index 1
set -gw pane-base-index 1
set -g renumber-windows on

# Switch to another active session instead of detaching when closing a session
set -g detach-on-destroy off

# Disable visual/audible bells and activity highlights
set -g bell-action none
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -gw monitor-activity off

# ============================================================================
# 4. Vi Mode & System Clipboard (Wayland / X11 / OSC 52)
# ============================================================================
set -g status-keys vi
set -gw mode-keys vi

# Enable OSC 52 clipboard integration for both tmux and inner applications
set -s set-clipboard on

# Pipe copy-mode selections to Linux system clipboard (Wayland -> X11 -> WSL fallback)
set -s copy-command 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then wl-copy >/dev/null 2>&1; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard >/dev/null 2>&1; elif [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1; then xsel -i -b >/dev/null 2>&1; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; else cat >/dev/null; fi'

# Enter copy mode with Prefix + [ or Prefix + Escape
bind Escape copy-mode

# Vim visual selection and yank bindings in copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-pipe-end-of-line-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape if-shell -F "#{selection_present}" "send-keys -X clear-selection" "send-keys -X cancel"

# ============================================================================
# 5. Keybindings (Splits, Windows & Vim Pane Navigation)
# ============================================================================
# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Vim-style splits preserving the current pane directory
#   v -> vertical split (side-by-side, matching Vim :vsplit)
#   s -> horizontal split (top/bottom, matching Vim :split)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Open new window in the current pane directory
bind c new-window -c "#{pane_current_path}"

# Session tree moved from 's' to 'S' ('w' remains window/session tree)
bind S choose-tree -Zs

# Switch to last active window (replaces default 'l', now used for pane-right)
bind Tab last-window

# Move between panes using Vim motions (non-repeatable to avoid eating typed chars)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using shifted Vim motions (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap windows left/right
bind -r M-h swap-window -d -t -1
bind -r M-l swap-window -d -t +1

# ============================================================================
# 6. Appearance (Top Status Bar, Transparent Background)
# ============================================================================
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=default"

# Left: session name (highlights yellow while Prefix is active)
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=yellow bold],#[fg=green bold]}#S #[fg=brightblack nobold]│ "

# Windows: clean tabs without background fill
set -gw window-status-separator "  "
set -gw window-status-format "#[fg=brightblack]#I:#W#{?window_flags,#{window_flags},}"
set -gw window-status-current-format "#[fg=cyan bold]#I:#W#{?window_zoomed_flag, [Z],}"

# Right: active mode badges + short hostname + time
set -g status-right-length 60
set -g status-right "#{?pane_in_mode,#[fg=yellow bold]COPY #[fg=brightblack nobold]│ ,}#{?pane_synchronized,#[fg=red bold]SYNC #[fg=brightblack nobold]│ ,}#[fg=brightblack nobold]#h │ %H:%M"

# Pane borders and prompts
set -gw pane-border-lines single
set -gw pane-border-style "fg=brightblack"
set -gw pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?pane_synchronized,fg=red,fg=cyan}}"

set -g message-style "bg=default,fg=yellow,bold"
set -g message-command-style "bg=default,fg=cyan,bold"
set -gw mode-style "bg=yellow,fg=black,bold"
